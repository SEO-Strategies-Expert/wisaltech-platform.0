::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#2c2c34;border-radius:8px}
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--bg2);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;
padding:16px 12px;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.logo{width:42px;height:42px;border-radius:12px;background:radial-gradient(circle at 30% 30%,#1c2b33,#0e1417);display:grid;place-items:center;overflow:hidden;border:1px solid #24323a;flex-shrink:0}
.logo img{width:36px;height:36px;object-fit:contain}
.brand .wm{font-weight:800;letter-spacing:1px;font-size:15px}.brand .wm small{display:block;font-size:10px;color:var(--mut);letter-spacing:0;font-weight:600}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;background:transparent;color:var(--mut);
cursor:pointer;border-radius:11px;font-size:13.5px;text-align:right;font-family:inherit;transition:.12s}
.nav button:hover{background:#20232a;color:var(--txt)}
.nav button.on{background:var(--lime);color:#111;font-weight:700}
.nav button .ic{width:22px;text-align:center;font-size:16px}
.nav .badge2{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:20px;font-size:10px;padding:1px 7px;font-weight:700}
.nav button.on .badge2{background:#111;color:var(--lime)}
.grp{font-size:10px;color:#5b5e67;padding:12px 12px 4px;font-weight:700;letter-spacing:1px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:15px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:20}
.top h1{font-size:18px;margin:0;font-weight:800}
.search{margin-inline-start:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 16px;color:var(--mut);font-size:12px;min-width:150px}
.newbtn{background:var(--lime);color:#111;border:0;border-radius:22px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px}
.content{padding:20px 22px 90px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tile .lbl{color:var(--mut);font-size:12px;margin-bottom:8px}.tile .v{font-size:24px;font-weight:800}.tile .u{font-size:12px;color:var(--mut);font-weight:500}
.tile.lime .v{color:var(--lime)}.tile.warn .v{color:var(--red)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:18px}
.panel h3{margin:0 0 14px;font-size:14px;display:flex;align-items:center;gap:8px}
.panel h3 .n{background:var(--card2);color:var(--mut);border-radius:20px;padding:2px 9px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#0c0c0e;font-weight:800;font-size:12px;flex-shrink:0}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block}
.b-completed,.b-delivered,.b-paid,.b-live,.b-active,.b-confirmed,.b-won,.b-published,.b-approved,.b-connected,.b-ok{background:rgba(56,211,159,.15);color:var(--green)}
.b-pending,.b-qa_check,.b-sent,.b-proposal,.b-doing,.b-qualified{background:rgba(255,176,32,.15);color:var(--amber)}
.b-paused,.b-overdue,.b-blocked,.b-action_needed,.b-not_started{background:rgba(255,92,92,.15);color:var(--red)}
.b-new,.b-idea,.b-todo,.b-draft{background:rgba(90,169,255,.15);color:var(--blue)}
.tag{font-size:10px;background:var(--card2);color:var(--mut);padding:3px 9px;border-radius:8px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:12px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li:hover{background:var(--card2)}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--lime-d),var(--lime))}
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.kcol{min-width:230px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;flex-shrink:0}
.kcol h4{margin:0 0 10px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.stars{color:var(--amber);letter-spacing:2px}
.btn-sm{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:inherit}
.btn-lime{background:var(--lime);color:#111;border:0;border-radius:8px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.attach{border:1.5px dashed #3a3a44;border-radius:12px;padding:16px;text-align:center;color:var(--mut);font-size:12px;cursor:pointer}
.attach:hover{border-color:var(--lime);color:var(--lime)}
.back{background:0;border:0;color:var(--lime);cursor:pointer;font-size:13px;margin-bottom:12px;font-family:inherit}
.chatline{display:flex;gap:6px;margin-top:6px}.chip2{font-size:10px;background:var(--card2);color:var(--mut);padding:2px 8px;border-radius:10px}
.mnav{display:none}
@media(max-width:820px){
 .side{display:none}.content{padding:16px 14px 96px}.cols{grid-template-columns:1fr}
 .top{padding:12px 15px}.top h1{font-size:16px}.search{display:none}
 .mnav{display:flex;position:fixed;inset-inline:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50}
 .mnav button{background:0;border:0;color:var(--mut);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit}
 .mnav button b{font-size:18px;line-height:1}.mnav button.on{color:var(--lime)}
}

<style>
/* ========== ترقية بصرية فخمة (Premium Theme) ========== */

th{letter-spacing:.2px}
