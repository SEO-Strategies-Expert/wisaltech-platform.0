.logo img{width:48px;height:48px;object-fit:contain}
.lime{background:var(--lime);color:#111;border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-family:inherit;font-size:14px;margin-top:6px}
label{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block}
.b-live,.b-paid,.b-delivered,.b-completed{background:rgba(56,211,159,.15);color:var(--green)}
.b-draft,.b-idea,.b-sent{background:rgba(90,169,255,.15);color:var(--blue)}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--lime)}

.top{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.top .t{font-weight:800}.top .t small{display:block;color:var(--mut);font-size:11px}
.out{margin-inline-start:auto;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:12px}
.wrap{padding:22px;max-width:1000px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.tile .lbl{color:var(--mut);font-size:12px}.tile .v{font-size:22px;font-weight:800;margin-top:6px}
h3{font-size:15px;margin:22px 0 12px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.attach{border:1.5px dashed #3a3a44;border-radius:10px;padding:10px;text-align:center;color:var(--mut);font-size:11px;margin-top:8px}
@media(max-width:640px){.wrap{padding:14px}}

<div class="t">بورتال العميل<small id="cname">—</small></div><button class="out" onclick="logout()">خروج</button></div>
<div class="wrap" id="app"><p style="color:var(--mut)">جارِ التحميل...</p></div>
<script>
const token=localStorage.getItem('wt_token');
if(!token) location.href='/login.html';
const H={headers:{'Authorization':'Bearer '+token}};
const money=n=>Number(n||0).toLocaleString('en-US');
const bd=(s)=>`<span class="badge b-${s}">${({live:'شغّالة',paid:'مدفوعة',delivered:'تم التسليم',completed:'مكتمل',draft:'مسودة',sent:'مُرسل'})[s]||s}</span>`;
async function load(){
 try{
  const me=await (await fetch('/api/portal/me',H)).json();
  if(me.error){location.href='/login.html';return;}
  document.getElementById('cname').textContent=me.client.name;
  const d=await (await fetch('/api/portal/overview',H)).json();
  const app=document.getElementById('app');
  const totalSpend=d.campaigns.reduce((a,b)=>a+(b.spend_qar||0),0);
  app.innerHTML=`
   <div class="tiles">
    <div class="card tile"><div class="lbl">حملاتك</div><div class="v" style="color:var(--lime)">${d.campaigns.length}</div></div>
    <div class="card tile"><div class="lbl">أعمالك المنجزة</div><div class="v">${d.deliverables.length}</div></div>
    <div class="card tile"><div class="lbl">فواتيرك</div><div class="v">${d.invoices.length}</div></div>
    <div class="card tile"><div class="lbl">إنفاق إعلاني</div><div class="v">${money(totalSpend)} <span style="font-size:12px;color:var(--mut)">ر</span></div></div>
   </div>
   <h3>حملاتك الإعلانية</h3><div class="card">${d.campaigns.map(c=>`<div style="margin-bottom:14px">
     <div style="display:flex;justify-content:space-between"><b>${c.name}</b>${bd(c.status)}</div>
     <div style="color:var(--mut);font-size:12px;margin-top:4px">منصرف ${money(c.spend_qar)}/${money(c.budget_qar)} ر · ${c.kpi_actual}/${c.kpi_target} ${c.kpi_metric}</div>
     <div class="bar"><i style="width:${Math.min(100,100*c.spend_qar/c.budget_qar)}%"></i></div></div>`).join('')||'<span style="color:var(--mut)">لا حملات حالية</span>'}</div>
   <h3>أعمالك وتصميماتك</h3><div class="card">${d.deliverables.map(x=>`<div class="li">
     <div style="flex:1"><b>${x.title}</b><div style="color:var(--mut);font-size:12px">${x.work_type} · ${bd(x.status)}</div></div></div>
     <div class="attach">📎 ملف العمل — يتاح للتحميل عند رفعه</div>`).join('')||'—'}</div>
   <h3>مؤشرات أدائك</h3><div class="card">${d.kpis.map(k=>`<div class="li"><div style="flex:1">${k.name}</div>
     <div><b>${k.actual}</b> <span style="color:var(--mut)">/ ${k.target}</span></div></div>`).join('')||'—'}</div>
   <h3>فواتيرك</h3><div class="card">${d.invoices.map(iv=>`<div class="li"><div style="flex:1"><b>${iv.number}</b>
     <div style="color:var(--mut);font-size:12px">${iv.issue_date}</div></div>${bd(iv.status)}</div>`).join('')||'—'}</div>
   <p style="color:var(--mut);font-size:12px;margin-top:20px">🔒 أنت ترى بيانات <b>${me.client.name}</b> فقط — معزولة تمامًا عن باقي العملاء.</p>`;
 }catch(e){document.getElementById('app').innerHTML='<p style="color:var(--red)">تعذّر التحميل</p>';}
}
function logout(){localStorage.clear();location.href='/login.html';}
load();
</script></body></html>
