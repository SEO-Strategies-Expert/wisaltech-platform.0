      const $=(s,c=document)=>c.querySelector(s), $$=(s,c=document)=>[...c.querySelectorAll(s)];

      const closeMobile=()=>{nav.classList.remove('mobile-open');menuBtn?.setAttribute('aria-expanded','false')};
      menuBtn?.addEventListener('click',()=>{const open=nav.classList.toggle('mobile-open');menuBtn.setAttribute('aria-expanded',String(open));if(open){Object.assign(nav.style,{display:'flex',position:'fixed',top:'84px',right:'8px',left:'8px',padding:'14px',background:'var(--header)',backdropFilter:'blur(20px)',border:'1px solid var(--line)',borderRadius:'20px',flexDirection:'column',alignItems:'stretch',boxShadow:'var(--shadow-2)'})}else nav.removeAttribute('style')});

      addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;progress.style.width=`${h?scrollY/h*100:0}%`},{passive:true});

      let observer;
      function observeReveals(){observer?.disconnect();observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}}),{threshold:.12});$$('[data-reveal]:not(.visible)').forEach(el=>observer.observe(el));}
      observeReveals();

      const countObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(!entry.isIntersecting)return;const el=entry.target,target=+el.dataset.count,start=performance.now(),dur=1100;const tick=t=>{const p=Math.min((t-start)/dur,1);el.textContent=Math.round(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick);countObserver.unobserve(el)}),{threshold:.55});$$('.count').forEach(el=>countObserver.observe(el));

      $$('.filter-btn[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{$$('.filter-btn[data-filter]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const f=btn.dataset.filter;let visible=0;$$('.service-card').forEach(c=>{const show=f==='all'||c.dataset.category===f;c.classList.toggle('hidden',!show);if(show)visible++});const sc=$('.service-count');if(sc)sc.textContent=`${visible} Wisal Tech`}));
      $$('.filter-btn[data-work-filter]').forEach(btn=>btn.addEventListener('click',()=>{$$('.filter-btn[data-work-filter]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const f=btn.dataset.workFilter;$$('.portfolio-item').forEach(c=>{c.style.display=f==='all'||c.dataset.work===f?'block':'none'})}));

      $$('.faq-q').forEach(q=>q.addEventListener('click',()=>{const item=q.closest('.faq-item'),open=item.classList.toggle('open');q.setAttribute('aria-expanded',String(open))}));

      const modal=$('#project-modal');
      if(modal){
        const modalImage=$('#modal-image'), modalTitle=$('#modal-title'), modalSubtitle=$('#modal-subtitle');
        const closeModal=()=>{modal.classList.remove('open');document.body.style.overflow='';modalImage.src=''};
        $$('.project-open').forEach(card=>card.addEventListener('click',()=>{modalImage.src=card.dataset.image;modalImage.alt=card.dataset.title;modalTitle.textContent=card.dataset.title;modalSubtitle.textContent=card.dataset.subtitle||'';modal.classList.add('open');document.body.style.overflow='hidden';$('.modal-close').focus()}));
        $('.modal-close').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
      }

      const form=$('#project-form');
      form?.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(form);const text=`WISAL TECH — PROJECT BRIEF

Wisal Tech: ${fd.get('name')}
Wisal Tech: ${fd.get('company')||'-'}
Wisal Tech: ${fd.get('email')}
Get Started: ${fd.get('phone')||'-'}
Get Started: ${fd.get('project')}
Get Started: ${fd.get('timeline')}
Get Started: ${fd.get('budget')}

Wisal Tech / Wisal Tech:
${fd.get('goal')}

Language Options Language Options Wisal Tech Wisal Tech.`;const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`wisal-tech-brief-${Date.now()}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);$('#success-box')?.classList.add('show')});
      $('#magnet-form')?.addEventListener('submit',e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button');btn.textContent='Get Started';btn.disabled=true});

      const dot=$('.cursor-dot'),ring=$('.cursor-ring');let mx=0,my=0,rx=0,ry=0;
      addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;dot.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`},{passive:true});
      const cursorLoop=()=>{rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`;requestAnimationFrame(cursorLoop)};requestAnimationFrame(cursorLoop);
      $$('a,button,.project-open,.portfolio-item').forEach(el=>{el.addEventListener('mouseenter',()=>ring.classList.add('hover'));el.addEventListener('mouseleave',()=>ring.classList.remove('hover'))});

      if(matchMedia('(hover:hover) and (pointer:fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches){$$('.magnetic').forEach(btn=>{btn.addEventListener('mousemove',e=>{const r=btn.getBoundingClientRect();btn.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.09}px,${(e.clientY-r.top-r.height/2)*.12}px)`});btn.addEventListener('mouseleave',()=>btn.style.transform='')})}

      $$('.nav-item.has-dropdown').forEach(function(item){
        var toggle = item.querySelector('.nav-dd-toggle');
        toggle && toggle.addEventListener('click', function(e){
          e.preventDefault();
          var open = item.classList.toggle('dd-open');
          toggle.setAttribute('aria-expanded', String(open));
        });
      });
      addEventListener('click', function(e){
        $$('.nav-item.dd-open').forEach(function(item){
          if(!item.contains(e.target)) item.classList.remove('dd-open');
        });
      });
      addEventListener('keydown', function(e){
        if(e.key === 'Escape') $$('.nav-item.dd-open').forEach(function(item){item.classList.remove('dd-open')});
      });

    })();
  </script>
  <style>
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:1100px){.nav.mobile-open a{width:100%;padding:13px 15px}.nav.mobile-open a.active{background:var(--soft)}}
  </style>
