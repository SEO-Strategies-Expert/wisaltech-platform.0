<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مرفقات المشاريع — وصال تك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0b0e; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.06); --line:rgba(255,255,255,.10); --txt:#e9ecf1; --mut:#9aa3af; --lime:#c8f94e; --lime2:#cbfb5a; --danger:#ff6b6b; }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,rgba(200,249,78,.06),transparent),var(--bg);color:var(--txt);font-family:'Tajawal',system-ui,sans-serif;min-height:100vh}
  a{color:var(--lime)}
  .wrap{max-width:1050px;margin:0 auto;padding:22px 18px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
  .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--lime),#8fd93a);display:grid;place-items:center;color:#0a0b0e;font-weight:800}
  .badge{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
  .glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:20px}
  h1{font-size:18px;margin:0 0 4px}
  .mut{color:var(--mut);font-size:13px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
  input,select,button,textarea{font-family:inherit}
  input[type=text],input[type=email],input[type=password],input[type=url],select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--txt);font-size:15px;outline:none}
  input:focus,select:focus{border-color:var(--lime)}
  .btn{background:linear-gradient(135deg,var(--lime),var(--lime2));color:#0a0b0e;border:none;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .drop{margin-top:8px;border:1.5px dashed var(--line);border-radius:16px;padding:26px;text-align:center;cursor:pointer;transition:.15s;background:rgba(255,255,255,.02)}
  .drop:hover,.drop.over{border-color:var(--lime);background:rgba(200,249,78,.05)}
  .grid{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
  .card .thumb{height:110px;background:#000 center/cover no-repeat;display:grid;place-items:center;color:var(--mut);font-size:34px}
  .card .meta{padding:9px 10px}
  .card .meta .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta .k{font-size:11px;color:var(--mut);margin-top:2px}
  .card .del{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);border:none;color:var(--danger);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:14px}
  .empty{color:var(--mut);text-align:center;padding:26px;font-size:14px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#141519;border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-size:14px;display:none;z-index:9}
  .toast.err{border-color:var(--danger);color:#ffd0d0}
  .hide{display:none}
  .bar{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:12px}
  .bar>i{display:block;height:100%;width:0;background:var(--lime);transition:.2s}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot">و</span> وصال تك</div>
    <span class="badge">مرفقات المشاريع · رفع فعلي</span>
  </div>

  <!-- Login -->
  <div id="loginView" class="glass hide" style="max-width:420px;margin:40px auto">
    <h1>تسجيل الدخول</h1>
    <div class="mut">ادخل بحساب الوكالة لإدارة مرفقات العملاء.</div>
    <label>البريد</label>
    <input id="email" type="email" placeholder="admin@wisaltech.qa" autocomplete="username">
    <label>كلمة السر</label>
    <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
    <div style="margin-top:16px"><button class="btn" id="loginBtn" style="width:100%">دخول</button></div>
    <div id="loginErr" class="mut" style="color:var(--danger);margin-top:10px"></div>
  </div>

  <!-- Main -->
  <div id="mainView" class="hide">
    <div class="glass">
      <div class="row" style="justify-content:space-between">
        <div>
          <h1>مرفقات العملاء</h1>
          <div class="mut">ارفع الصور والملفات أو أضف روابط لكل عميل — بتظهر للعميل في بورتاله.</div>
        </div>
        <button class="btn-ghost" id="logoutBtn">خروج</button>
      </div>
      <label>اختر العميل / المشروع</label>
      <select id="clientSel"></select>

      <div id="cfgWarn" class="hide mut" style="color:var(--danger);margin-top:12px"></div>

      <div class="drop" id="drop">
        <div style="font-size:15px">🗂️ اسحب ملف/صورة هنا أو اضغط للاختيار</div>
        <div class="mut" style="margin-top:4px">صور، PDF، مستندات… يتم رفعها فعليًا وتخزينها</div>
        <input id="fileInput" type="file" class="hide" multiple>
      </div>
      <div class="bar hide" id="bar"><i></i></div>

      <label>أو أضف رابط (Drive / Dropbox / Behance …)</label>
      <div class="row">
        <input id="linkUrl" type="url" placeholder="https://…" style="flex:1;min-width:200px">
        <input id="linkTitle" type="text" placeholder="عنوان (اختياري)" style="flex:1;min-width:160px">
        <button class="btn" id="addLink">إضافة</button>
      </div>

      <div id="grid" class="grid"></div>
      <div id="emptyMsg" class="empty hide">لا توجد مرفقات لهذا العميل بعد.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = location.origin;
const TKEY = 'wt_att_token';
let token = localStorage.getItem(TKEY) || '';
let CFG = null;            // {cloudName, uploadPreset}
let clients = [];
const $ = s => document.querySelector(s);

function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast'+(err?' err':''); t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none', err?4500:2500); }
async function api(path, opts){ opts=opts||{}; opts.headers=Object.assign({'Content-Type':'application/json'}, opts.headers||{}); if(token) opts.headers['Authorization']='Bearer '+token; const r=await fetch(API+path, opts); let d; try{d=await r.json();}catch(e){d=null;} if(r.status===401){ logout(); throw new Error('انتهت الجلسة'); } if(!r.ok) throw new Error((d&&d.error)||('خطأ '+r.status)); return d; }

function show(view){ $('#loginView').classList.toggle('hide', view!=='login'); $('#mainView').classList.toggle('hide', view!=='main'); }
function logout(){ token=''; localStorage.removeItem(TKEY); show('login'); }

$('#loginBtn').onclick = async () => {
  $('#loginErr').textContent=''; $('#loginBtn').disabled=true;
  try{
    const d = await api('/api/auth/login', {method:'POST', body:JSON.stringify({email:$('#email').value.trim(), password:$('#pass').value})});
    if(d.user && d.user.role==='client'){ $('#loginErr').textContent='هذا الحساب حساب عميل — ادخل بحساب الوكالة.'; return; }
    token = d.token; localStorage.setItem(TKEY, token); await boot();
  }catch(e){ $('#loginErr').textContent = e.message || 'فشل الدخول'; }
  finally{ $('#loginBtn').disabled=false; }
};
$('#logoutBtn').onclick = logout;

async function boot(){
  show('main');
  try{ CFG = await api('/api/config'); }catch(e){ CFG=null; }
  if(!CFG || !CFG.cloudName || !CFG.uploadPreset){
    $('#cfgWarn').classList.remove('hide');
    $('#cfgWarn').textContent = 'رفع الملفات غير مُفعّل بعد (إعداد Cloudinary ناقص) — إضافة الروابط تعمل الآن.';
  } else { $('#cfgWarn').classList.add('hide'); }
  clients = await api('/api/agency/clients');
  const sel=$('#clientSel'); sel.innerHTML = clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  sel.onchange = loadList;
  await loadList();
}

async function loadList(){
  const cid = $('#clientSel').value;
  const list = await api('/api/agency/attachments?client_id='+cid);
  const grid=$('#grid'); grid.innerHTML='';
  $('#emptyMsg').classList.toggle('hide', list.length>0);
  for(const a of list){
    const isImg = a.kind==='image' || /\.(png|jpe?g|gif|webp|svg)$/i.test(a.url||'');
    const el=document.createElement('div'); el.className='card';
    const icon = a.kind==='link' ? '🔗' : (a.kind==='image'||isImg ? '' : '📄');
    el.innerHTML = `
      <button class="del" title="حذف" data-id="${a.id}">✕</button>
      <a href="${a.url}" target="_blank" rel="noopener">
        <div class="thumb" ${isImg?`style="background-image:url('${a.url}')"`:''}>${isImg?'':icon}</div>
      </a>
      <div class="meta"><div class="t">${a.title||a.url.split('/').pop()}</div><div class="k">${a.kind==='link'?'رابط':(isImg?'صورة':'ملف')}</div></div>`;
    el.querySelector('.del').onclick = async (ev)=>{ ev.preventDefault(); if(!confirm('حذف هذا المرفق؟'))return; try{ await api('/api/agency/attachments/'+a.id,{method:'DELETE'}); toast('تم الحذف'); loadList(); }catch(e){toast(e.message,true);} };
    grid.appendChild(el);
  }
}

async function saveAttachment(cid, title, kind, url){
  await api('/api/agency/attachments', {method:'POST', body:JSON.stringify({client_id:+cid, title, kind, url})});
}

// ---- Cloudinary unsigned upload ----
async function uploadToCloudinary(file, onProgress){
  if(!CFG || !CFG.cloudName || !CFG.uploadPreset) throw new Error('رفع الملفات غير مُفعّل (Cloudinary)');
  const url = `https://api.cloudinary.com/v1_1/${CFG.cloudName}/auto/upload`;
  const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', CFG.uploadPreset);
  return await new Promise((res, rej)=>{
    const xhr = new XMLHttpRequest(); xhr.open('POST', url);
    xhr.upload.onprogress = e => { if(e.lengthComputable && onProgress) onProgress(e.loaded/e.total); };
    xhr.onload = () => { try{ const d=JSON.parse(xhr.responseText); if(xhr.status>=200&&xhr.status<300 && d.secure_url) res(d); else rej(new Error((d.error&&d.error.message)||'فشل الرفع')); }catch(e){ rej(new Error('رد غير متوقع من Cloudinary')); } };
    xhr.onerror = () => rej(new Error('تعذّر الاتصال بـ Cloudinary'));
    xhr.send(fd);
  });
}

async function handleFiles(files){
  const cid = $('#clientSel').value;
  const bar=$('#bar'), fill=bar.querySelector('i');
  for(const f of files){
    bar.classList.remove('hide'); fill.style.width='0%';
    try{
      const d = await uploadToCloudinary(f, p=>fill.style.width=Math.round(p*100)+'%');
      const kind = (d.resource_type==='image') ? 'image' : 'file';
      await saveAttachment(cid, f.name, kind, d.secure_url);
      toast('تم رفع: '+f.name);
    }catch(e){ toast(e.message, true); }
  }
  bar.classList.add('hide'); loadList();
}

const drop=$('#drop'), fi=$('#fileInput');
drop.onclick=()=>fi.click();
fi.onchange=()=>{ if(fi.files.length) handleFiles([...fi.files]); fi.value=''; };
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop', e=>{ if(e.dataTransfer.files.length) handleFiles([...e.dataTransfer.files]); });

$('#addLink').onclick = async () => {
  const url=$('#linkUrl').value.trim(); if(!url){toast('اكتب الرابط أولًا',true);return;}
  try{ await saveAttachment($('#clientSel').value, $('#linkTitle').value.trim()||null, 'link', url); $('#linkUrl').value=''; $('#linkTitle').value=''; toast('تمت إضافة الرابط'); loadList(); }
  catch(e){ toast(e.message, true); }
};

// init
if(token) boot().catch(()=>logout()); else show('login');
</script>
</body>
</html>
